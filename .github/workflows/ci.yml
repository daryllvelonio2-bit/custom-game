name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The game depends on the engine via a path dependency (`../custom-game-engine`),
      # so the engine repo must sit next to the game repo in the runner workspace.
      - name: Checkout engine repo
        uses: actions/checkout@v4
        with:
          repository: daryllvelonio2-bit/custom-game-engine
          path: custom-game-engine
      - name: Move engine next to game repo
        run: mv "$GITHUB_WORKSPACE/custom-game-engine" "$GITHUB_WORKSPACE/../custom-game-engine"
      # rodio (audio) needs ALSA headers on Linux; wgpu needs pkg-config.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            pkg-config \
            libudev-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Caches the registry plus the target dir named in .cargo/config.toml.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run cargo check
        run: cargo check --locked
      - name: Run cargo test
        run: cargo test --locked
