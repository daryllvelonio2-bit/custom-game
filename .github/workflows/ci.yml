name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The engine is vendored at `src/custom-engine/` and is a workspace member,
      # so this one checkout is all CI needs.
      - uses: actions/checkout@v4
      # rodio (audio) needs ALSA headers on Linux; wgpu needs pkg-config.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            pkg-config \
            libudev-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Caches the registry plus the target dir named in .cargo/config.toml.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run cargo check
        run: cargo check --locked --workspace --all-targets
      - name: Run cargo test
        run: cargo test --locked --workspace
